services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      # Must match the frontend origin for CORS (backend/src/app.ts)
      # and Socket.IO, and for verify-email links.
      APP_URL: http://localhost:8080
      PORT: 5000
      # Plain HTTP locally: browsers drop Secure cookies, which would
      # silently break refresh. Set "true" behind real HTTPS.
      COOKIE_SECURE: "false"
      # Local compose defaults (override with backend/.env for Neon/Upstash).
      # NOTE: `environment` wins over `env_file`, so these values take
      # precedence while set here. Comment them out to use external DB/Redis.
      DATABASE_URL: postgresql://${POSTGRES_USER:-kivo}:${POSTGRES_PASSWORD:-kivo}@db:5432/${POSTGRES_DB:-kivo}
      DATABASE_URL_DIRECT: postgresql://${POSTGRES_USER:-kivo}:${POSTGRES_PASSWORD:-kivo}@db:5432/${POSTGRES_DB:-kivo}
      REDIS_URL: redis://redis:6379
    ports:
      - 5000:5000
    expose:
      - 5000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["node", "dist/infrastructure/queue/workers/workers.js"]
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-kivo}:${POSTGRES_PASSWORD:-kivo}@db:5432/${POSTGRES_DB:-kivo}
      DATABASE_URL_DIRECT: postgresql://${POSTGRES_USER:-kivo}:${POSTGRES_PASSWORD:-kivo}@db:5432/${POSTGRES_DB:-kivo}
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["node", "dist/infrastructure/database/migration-runner.js"]
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL_DIRECT: postgresql://${POSTGRES_USER:-kivo}:${POSTGRES_PASSWORD:-kivo}@db:5432/${POSTGRES_DB:-kivo}
    depends_on:
      db:
        condition: service_healthy
    # One-shot: exits 0 when schema is up to date, nonzero on failure
    # (backend/worker only start on service_completed_successfully).
    restart: "no"

  frontend:
    build:
      context: ./frontend
      # Empty = same-origin via nginx proxy (/api, /socket.io).
      # Only set these for cross-origin deploys.
      args:
        VITE_API_URL: ""
        VITE_SOCKET_URL: ""
    environment:
      # Must match the backend service name above (Docker DNS).
      BACKEND_URL: http://backend:5000
    ports:
      - 8080:80
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      # Single source of truth for DB creds (override in prod: POSTGRES_PASSWORD=...).
      # NOTE: URL-encode special characters if your password has any (@ : / ? #).
      POSTGRES_USER: ${POSTGRES_USER:-kivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kivo}
      POSTGRES_DB: ${POSTGRES_DB:-kivo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kivo -d kivo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
